# Business Inspector
# http://<host>:8083
# ────────────────────────
services:
  inspector-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: inspector-app
    env_file: .env
    environment:
      - FLASK_ENV=production
      - PYTHONUNBUFFERED=1
    networks:
      - inspector_net
    restart: unless-stopped
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.50"
        reservations:
          memory: 128M

  inspector-nginx:
    image: nginx:1.27-alpine
    container_name: inspector-nginx
    ports:
      - "8083:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      inspector-app:
        condition: service_healthy
    networks:
      - inspector_net
    restart: unless-stopped

networks:
  inspector_net:
    driver: bridge
    name: inspector-network
